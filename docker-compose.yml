services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: ymh421-kafka
    ports:
      - "9094:9094"            # host'tan erişim (ör. producer'ı host'ta çalıştırmak için)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft: ZooKeeper yok
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 30

  jupyter:
    build: .
    image: ymh421-spark:latest
    container_name: ymh421-jupyter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8888:8888"            # JupyterLab
      - "4040-4045:4040-4045"  # Spark UI (notebook başına bir port)
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: btc-tx
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-6g}
    volumes:
      - ./:/work
